# build-gate — MI Apps pre-merge build check.
# Fails a commit/PR (red X) if the app doesn't install + build cleanly, so broken code
# can't sit on a deploy branch unbuilt. Catches pnpm-lock.yaml drift (frozen lockfile)
# + tsc/vite errors. Fleet standard: Corepack pnpm@11.17.0 on Node 24.
name: build-gate
on:
  push:
    branches: [stack-migration, master, main, dev]
  pull_request:
    branches: [stack-migration, master, main]
jobs:
  build-gate:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack + pin pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Ratchet rule: this repo typechecks clean today (0 errors across both tsconfig
      # projects), so the gate is BLOCKING to keep it there; repos that still have errors
      # run this step warn-only. `vite build` is transpile-only, so without this step
      # client-side tsc errors are invisible.
      - name: Typecheck
        run: pnpm run --if-present typecheck
      - name: Lint (Biome — warn-only during rollout)
        continue-on-error: true
        run: pnpm run lint
      - name: Build
        run: pnpm run build
